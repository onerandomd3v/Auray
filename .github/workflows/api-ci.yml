name: API CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  api-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: auray_test
          POSTGRES_PASSWORD: auray_test
          POSTGRES_DB: auray_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auray_test -d auray_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AURAY_TEST_DATABASE_URL: postgresql://auray_test:auray_test@127.0.0.1:5432/auray_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.20.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @auray/api lint
      - name: Typecheck
        run: pnpm --filter @auray/api typecheck
      - name: API tests (unit and PostgreSQL integration)
        run: pnpm --filter @auray/api test
      - name: Build
        run: pnpm --filter @auray/api build
