# Temporary one-time workflow; must be removed before merging PR #2.
name: Regenerate pnpm lockfile for Tailwind CSS
on:
  push:
    branches: [chore/scaffold-apps-and-real-ci]
    paths:
      - apps/web/**/package.json
      - .github/workflows/lockfile-bootstrap.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.20.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Regenerate root lockfile
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Commit updated lockfile to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock Tailwind CSS dependencies"
            git push origin HEAD:chore/scaffold-apps-and-real-ci
          fi
